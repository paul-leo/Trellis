# .trellis/mcp/servers.yaml — canonical MCP server definitions.
#
# Rules (see docs/architecture.md and docs/research.md §"Secrets"):
#   - `env` values are variable NAMES only. Never a literal secret.
#   - Real values come from whatever already populates process env
#     (a plain `.env`-style file, 1Password's `op run`, etc.) — Trellis
#     does not store or transport secret values itself.
#   - `static_env` is the one deliberate exception: values written into
#     the agent's config verbatim, for something that was never a secret
#     in the first place (an email address, an environment tag) — still
#     scanned against `reject_patterns` like everything else, so a real
#     credential accidentally placed there is still refused, not silently
#     written (trellis-mcp-static-env-and-disabled-servers).
#   - `env_aliases` is for a var whose own name differs from the name it
#     should resolve (`target_key: source_variable_name`) — resolved
#     through the exact same mechanism as `env`, just delivered under a
#     different key. Do NOT reach for `static_env` here: a "${SOURCE_NAME}"
#     string looks like it works but ships unexpanded to any agent with no
#     `${VAR}` runtime of its own (trellis-migrate-env-var-alias).
#   - `enabled: false` keeps a server's definition in canonical without
#     writing it to any agent — for a server you want to keep configured
#     but not currently active everywhere, matching how a real agent's
#     own config often already represents "off, not deleted".
#   - A server name that a host environment is known to inject at runtime
#     (see `known_host_injected` below) must not be redefined here — on
#     Codex this causes the entire process to fail to start, not just that
#     server. See docs/research.md §"Codex — three hard constraints".
#   - `agents:` is optional and restricts a server to specific agents; omit
#     it and the server goes to all four (the default). Unlike skills/
#     subagents/memories, this scoping lives inline here rather than in
#     `scope.yaml` — this file is Trellis's own format, never handed to an
#     agent directly, so there's no risk of an agent rejecting an unknown
#     field the way Codex does with SKILL.md frontmatter.

servers:
  # Default shared-memory backend (docs/research.md "Shared memory") —
  # @modelcontextprotocol/server-memory: zero-dependency, local JSON
  # knowledge graph, MIT-licensed. Left commented out here because this
  # exact example ALSO lists "memory" under known_host_injected below —
  # uncommenting both would self-collide (Trellis's own collision guard
  # would correctly refuse to write it). Which situation you're actually
  # in depends on your host:
  #   - If your host (e.g. mirasim) already injects a runtime connector
  #     under this name — check with `trellis doctor` — leave this
  #     commented out and keep "memory" in known_host_injected below;
  #     you already have it, just not from a static definition.
  #   - If your host injects nothing under this name, uncomment this
  #     entry AND remove "memory" from known_host_injected below (it's
  #     only there as inherited example content, not a fact about your
  #     environment) — that's what actually wires the default.
  # mem0/OpenMemory or a totalrecallai-class semantic-search server are
  # documented opt-in upgrades from this default, not silent defaults —
  # same section of docs/research.md.
  #
  # static_env.MEMORY_FILE_PATH: without this, the server's own unset-env
  # default resolves relative to wherever `npx` happened to cache the
  # package — not a stable location. Setting it explicitly to a path
  # under ~/.trellis/ is also what lets `trellis memory sync`
  # (trellis-memory-sync) find and write the same file the running
  # server itself reads at startup.
  # memory:
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-memory"]
  #   static_env:
  #     MEMORY_FILE_PATH: "~/.trellis/memories/graph.jsonl"

  # `static_env`: a value that was never a secret in the first place (an
  # email address, an environment tag) — written verbatim, never treated
  # as a name to resolve. Prefer `env` (names only) whenever a value
  # actually is a secret; `static_env` is the deliberate, visibly-different
  # exception, still scanned against `reject_patterns` like any other
  # literal field.
  tanka:
    transport: stdio
    command: tanka-mcp
    static_env:
      TANKA_EMAIL: "you@example.com"
      TANKA_ENV: "sd-or"

  gitlab:
    transport: stdio
    command: npx
    args: ["-y", "@zereight/mcp-gitlab"]
    env: [GITLAB_PERSONAL_ACCESS_TOKEN, GITLAB_API_URL]

  # `env_aliases`: the server wants `OPENAPI_MCP_HEADERS`, but your secret
  # manager holds it under a differently-named variable — a real example
  # found via migrating an actual Notion MCP server entry. Same resolution
  # discipline as `env`, just target-key -> source-name instead of
  # self-named.
  notion:
    transport: stdio
    command: npx
    args: ["-y", "@notionhq/notion-mcp-server"]
    env_aliases:
      OPENAPI_MCP_HEADERS: NOTION_OPENAPI_MCP_HEADERS

  # `enabled: false` keeps this definition in canonical without writing it
  # to any agent — for something you want configured but not currently
  # active anywhere. Remove the line (or set it to `true`) to turn it back
  # on everywhere at once, with nothing to redefine.
  supabase-db:
    transport: stdio
    command: npx
    args: ["-y", "@supabase/mcp-server-supabase"]
    env: [SUPABASE_ACCESS_TOKEN]
    enabled: false

  figma:
    transport: http
    url: "https://mcp.figma.com/mcp"

  # Example of a private/agent-specific server: only Claude Code has a use
  # for this one, so the other three agents never see it defined at all.
  claude-only-tool:
    transport: stdio
    command: node
    args: ["/path/to/claude-specific-server.js"]
    agents: [claude-code]

# Names a known host (e.g. mirasim) may inject into an agent process at
# runtime, independent of this file. Trellis's collision check refuses to
# generate a local definition under any of these names.
known_host_injected:
  - atlassian
  - sentry
  - memory
  - mirasim

# How the servers above reach the four agents. Omit BOTH blocks below for
# direct mode (today's default: every agent gets all N server definitions
# written straight into its native config).
#
# `hub` routes an agent through a single HTTP endpoint you operate
# somewhere else — the adapter then writes exactly ONE entry (this URL),
# not N. What runs behind the URL is not Trellis's concern: could be a
# self-hosted github.com/ravitemer/mcp-hub instance, a hosted mcp-router
# account, anything else speaking MCP over HTTP. No engine/product switch
# to maintain — see docs/architecture.md "MCP hub mode".
hub:
  url: "http://127.0.0.1:37373/mcp"

# `gateway` also collapses an agent to one entry, but what sits behind it
# is a local subprocess Trellis itself spawns (`trellis mcp-gateway`), not
# a URL you operate. It connects out to the servers above once, resolves
# their secrets through secrets.policy.yaml exactly as direct mode does,
# and exposes their tools as `<server>__<tool>`. There is nothing to start
# or stop: the agent spawns it like any other stdio MCP server, and it
# exits when the session ends.
#
# `gateway` and `hub` are independent and may both be present; gateway
# wins for any agent it covers. Omit `agents:` — the normal case — and it
# applies to every managed agent; list them to leave the rest in direct or
# hub mode.
#
# gateway:
#   enabled: true
#   agents: [claude-code, codex]
