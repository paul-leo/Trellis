# Sandbox-only fixture (trellis-secrets-audit-p3 tasks.md 4.1). Matches the
# variable names Trellis's own P2 sandbox fixtures already declare
# (SAMPLE_TOKEN in .claude.json/.codex/config.toml/.kiro/settings/mcp.json,
# REMOTE_BEARER_TOKEN/REMOTE_MULTI_TOKEN/REMOTE_MULTI_KEY added by
# trellis-mcp-transport-auth's headers-bearing fixture servers) so a clean
# sandbox run has zero findings by construction.
allowed_vars:
  - SAMPLE_TOKEN
  - REMOTE_BEARER_TOKEN
  - REMOTE_MULTI_TOKEN
  - REMOTE_MULTI_KEY

reject_patterns:
  - 'glpat-[A-Za-z0-9_-]{20,}'
  - 'sk-[A-Za-z0-9]{20,}'
  - 'ghp_[A-Za-z0-9]{30,}'
