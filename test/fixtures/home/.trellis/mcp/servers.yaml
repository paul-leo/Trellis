# Sandbox-only fixture (trellis-mcp-sync-p2 tasks.md 5.1, extended by
# trellis-memory-p6 tasks.md 3.1). Exercises, in one real `trellis mcp
# sync` run against the sandbox container:
#   - "sample-server": already correctly present in every fixture agent
#     config (.claude.json, .codex/config.toml, .kiro/settings/mcp.json) —
#     must be a true no-op, proving idempotency against real files, not
#     just in-memory structures.
#   - "new-tool": missing everywhere — must be created in every MCP-capable
#     agent (not pi, which has no native MCP client).
#   - "claude-only-tool": scoped — must be created only for claude-code.
#   - "sentry": collides with `known_host_injected` below (and with the
#     pre-existing `[mcp_servers.sentry]` fixture already hand-placed in
#     .codex/config.toml to model the incident class this guards against,
#     see that file's own comment) — must produce a conflict, never a
#     write, and must leave the existing config.toml section untouched.
#   - "memory": the real @modelcontextprotocol/server-memory package name
#     (trellis-memory-p6) — unscoped, so it must reach every MCP-capable
#     agent AND pi's bridge (resolveMcpPlan), proving the existing P2/P4
#     pipeline handles this specific real server correctly end-to-end.
#     Never actually spawned here — `trellis mcp sync` only writes
#     config, so no network access to the real npm registry is needed.
#   - "remote-bearer" (trellis-mcp-transport-auth): a single-bearer-token
#     `headers` shape — Claude Code/Kiro get the `headers` map verbatim;
#     Codex gets `bearer_token_env_var` instead, not `headers` at all.
#   - "remote-multi-header" (trellis-mcp-transport-auth): a `headers`
#     shape Codex cannot express (two headers) — must be a Codex-only
#     conflict while Claude Code/Kiro still receive it in full.
servers:
  sample-server:
    transport: stdio
    command: node
    args: ["/fixtures/sample-mcp-server.js"]
    env: [SAMPLE_TOKEN]

  new-tool:
    transport: stdio
    command: node
    args: ["/fixtures/sample-mcp-server.js"]

  claude-only-tool:
    transport: stdio
    command: node
    args: ["/fixtures/sample-mcp-server.js"]
    agents: [claude-code]

  sentry:
    transport: stdio
    command: node
    args: ["/fixtures/fake-sentry-stdio.js"]

  memory:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]

  remote-bearer:
    transport: http
    url: "https://example.com/mcp"
    headers:
      Authorization: "Bearer ${REMOTE_BEARER_TOKEN}"

  remote-multi-header:
    transport: http
    url: "https://example.com/mcp2"
    headers:
      Authorization: "Bearer ${REMOTE_MULTI_TOKEN}"
      X-Api-Key: "${REMOTE_MULTI_KEY}"

known_host_injected:
  - sentry
