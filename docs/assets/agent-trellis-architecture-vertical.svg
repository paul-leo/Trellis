<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">Agent Trellis — Unified Code Agent Runtime</title>
  <desc id="desc">A vertical architecture diagram showing one canonical source and Runtime foundation supporting multiple Code Agents through Skills, MCP, Memory, and Instructions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#111c24"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#293943"/>
      <stop offset="1" stop-color="#17232c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { fill: #f5efe3; font-size: 54px; font-weight: 750; letter-spacing: -1px; }
      .sub { fill: #a9efd2; font-size: 22px; font-weight: 650; letter-spacing: 1px; }
      .label { fill: #f5efe3; font-size: 25px; font-weight: 700; }
      .small { fill: #a4b2ba; font-size: 17px; }
      .tiny { fill: #7f919d; font-size: 14px; }
    </style>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <path d="M0 230H1080M0 1240H1080" stroke="#263640" stroke-width="1"/>

  <g class="sans">
    <text x="80" y="118" class="title">Agent Trellis</text>
    <text x="82" y="158" class="sub">UNIFIED CODE AGENT RUNTIME</text>
    <text x="80" y="208" class="small">一套 Runtime，统一托管 Code Agent 的运行能力</text>

    <g transform="translate(80 274)">
      <rect width="920" height="180" rx="22" fill="#101a22" stroke="#374852"/>
      <text x="42" y="50" class="small">解决三个问题</text>
      <text x="42" y="93" class="label">多 Agent，配置分散</text>
      <text x="42" y="130" class="label">MCP 重复，难以管理</text>
      <text x="42" y="167" class="label">Memory 与上下文割裂</text>
      <circle cx="850" cy="52" r="9" fill="#f2b35b"/>
      <circle cx="850" cy="90" r="9" fill="#a9efd2"/>
      <circle cx="850" cy="128" r="9" fill="#f2b35b"/>
    </g>

    <path d="M540 476V530" stroke="#a9efd2" stroke-width="3"/>
    <text x="540" y="520" text-anchor="middle" class="tiny">统一托管</text>

    <g filter="url(#shadow)">
      <rect x="80" y="548" width="920" height="300" rx="26" fill="url(#base)" stroke="#f2b35b" stroke-width="2"/>
      <rect x="110" y="580" width="860" height="72" rx="16" fill="#0e1820" stroke="#53636c"/>
      <rect x="110" y="668" width="860" height="72" rx="16" fill="#0e1820" stroke="#53636c"/>
      <rect x="110" y="756" width="860" height="58" rx="14" fill="#0e1820" stroke="#53636c"/>
    </g>
    <text x="540" y="618" text-anchor="middle" class="label">Agent Trellis Runtime</text>
    <text x="540" y="642" text-anchor="middle" class="tiny">canonical source · policy · adapters · providers</text>
    <text x="270" y="713" text-anchor="middle" class="label">Skills</text>
    <text x="540" y="713" text-anchor="middle" class="label">MCP</text>
    <text x="810" y="713" text-anchor="middle" class="label">Memory</text>
    <text x="540" y="791" text-anchor="middle" class="label">Instructions</text>

    <path d="M540 848V904" stroke="#f2b35b" stroke-width="3"/>
    <rect x="180" y="920" width="720" height="76" rx="18" fill="#101a22" stroke="#53636c"/>
    <text x="540" y="953" text-anchor="middle" class="label">Canonical Source</text>
    <text x="540" y="980" text-anchor="middle" class="mono small">~/.trellis</text>

    <path d="M540 996V1052" stroke="#a9efd2" stroke-width="3"/>
    <text x="540" y="1038" text-anchor="middle" class="tiny">运行在其上的 Code Agents</text>
    <g filter="url(#shadow)">
      <rect x="80" y="1070" width="280" height="80" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
      <rect x="400" y="1070" width="280" height="80" rx="16" fill="#17242c" stroke="#f2b35b" stroke-width="2"/>
      <rect x="720" y="1070" width="280" height="80" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
      <rect x="240" y="1170" width="280" height="80" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
      <rect x="560" y="1170" width="280" height="80" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
    </g>
    <text x="220" y="1120" text-anchor="middle" class="label">Claude Code</text>
    <text x="540" y="1120" text-anchor="middle" class="label">Codex</text>
    <text x="860" y="1120" text-anchor="middle" class="label">Kimi Code</text>
    <text x="380" y="1220" text-anchor="middle" class="label">Kiro</text>
    <text x="700" y="1220" text-anchor="middle" class="label">pi</text>
    <text x="540" y="1340" text-anchor="middle" class="mono small">one source · one runtime · many agents</text>
  </g>
</svg>
