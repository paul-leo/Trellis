<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Trellis — Unified Code Agent Runtime</title>
  <desc id="desc">A horizontal architecture diagram showing Code Agents running on top of Agent Trellis Runtime, which manages Skills, MCP, Memory, and Instructions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#111c24"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#273742"/>
      <stop offset="1" stop-color="#17232c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9efd2"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { fill: #f5efe3; font-size: 42px; font-weight: 720; letter-spacing: -.8px; }
      .subtitle { fill: #a9efd2; font-size: 18px; font-weight: 620; letter-spacing: 2px; }
      .label { fill: #f5efe3; font-size: 19px; font-weight: 680; }
      .small { fill: #9aaab4; font-size: 14px; }
      .tiny { fill: #7f919d; font-size: 12px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 120H1600M0 780H1600M120 0V900M1480 0V900" stroke="#24333d" stroke-width="1" opacity=".55"/>

  <g class="sans">
    <text x="100" y="94" class="title">Agent Trellis</text>
    <text x="102" y="127" class="subtitle">UNIFIED CODE AGENT RUNTIME</text>
    <text x="1500" y="96" text-anchor="end" class="small">one runtime · many coding agents</text>

    <!-- Agent layer -->
    <text x="800" y="190" text-anchor="middle" class="small" letter-spacing="2">CODE AGENTS</text>
    <g filter="url(#shadow)">
      <rect x="110" y="224" width="240" height="112" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
      <rect x="380" y="224" width="240" height="112" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
      <rect x="650" y="224" width="300" height="112" rx="16" fill="#17242c" stroke="#f2b35b" stroke-width="3"/>
      <rect x="980" y="224" width="240" height="112" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
      <rect x="1250" y="224" width="240" height="112" rx="16" fill="#17242c" stroke="#a9efd2" stroke-width="2"/>
    </g>
    <text x="230" y="274" text-anchor="middle" class="label">Claude Code</text>
    <text x="230" y="303" text-anchor="middle" class="tiny">native adapter</text>
    <text x="500" y="274" text-anchor="middle" class="label">Codex</text>
    <text x="500" y="303" text-anchor="middle" class="tiny">native adapter</text>
    <text x="800" y="274" text-anchor="middle" class="label">Kimi Code</text>
    <text x="800" y="303" text-anchor="middle" class="tiny">Runtime-first</text>
    <text x="1100" y="274" text-anchor="middle" class="label">Kiro</text>
    <text x="1100" y="303" text-anchor="middle" class="tiny">native adapter</text>
    <text x="1370" y="274" text-anchor="middle" class="label">pi</text>
    <text x="1370" y="303" text-anchor="middle" class="tiny">bridge adapter</text>

    <path d="M230 338V405M500 338V405M800 338V405M1100 338V405M1370 338V405" stroke="#a9efd2" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Runtime foundation -->
    <g filter="url(#shadow)">
      <rect x="140" y="420" width="1320" height="220" rx="24" fill="url(#base)" stroke="#f2b35b" stroke-width="2"/>
      <rect x="165" y="445" width="1270" height="68" rx="14" fill="#0e1820" stroke="#41515b"/>
      <rect x="165" y="528" width="1270" height="68" rx="14" fill="#0e1820" stroke="#41515b"/>
    </g>
    <text x="800" y="475" text-anchor="middle" class="label" font-size="24">Agent Trellis Runtime</text>
    <text x="800" y="501" text-anchor="middle" class="tiny">canonical source · policy · providers · adapters</text>
    <text x="325" y="570" text-anchor="middle" class="label">Skills</text>
    <text x="625" y="570" text-anchor="middle" class="label">MCP</text>
    <text x="925" y="570" text-anchor="middle" class="label">Memory</text>
    <text x="1225" y="570" text-anchor="middle" class="label">Instructions</text>
    <path d="M325 540v-20M625 540v-20M925 540v-20M1225 540v-20" stroke="#f2b35b" stroke-width="3"/>

    <!-- Canonical source -->
    <path d="M800 640V700" stroke="#f2b35b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="400" y="714" width="800" height="86" rx="18" fill="#101a22" stroke="#53636c"/>
    <text x="800" y="750" text-anchor="middle" class="label">Canonical Source</text>
    <text x="800" y="777" text-anchor="middle" class="mono small">~/.trellis  ·  one source of truth</text>
  </g>
</svg>
